# Daily heartbeat for the free hosting stack — Render's free tier has no
# Cron Jobs, so this workflow curls /keepalive/ every morning, which
# touches Supabase (prevents the 7-day idle pause), records a storage
# snapshot, and emails the 80%-quota alert if needed.
name: Daily keepalive

on:
  schedule:
    - cron: '30 0 * * *'   # 06:00 IST (UTC+5:30)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit keepalive endpoint (Render cold start can take ~50s)
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://a1computersolutions.in/keepalive/; then
              echo; echo "keepalive OK"
              exit 0
            fi
            echo "attempt $i failed, retrying…"; sleep 30
          done
          echo "keepalive FAILED"
          exit 1
