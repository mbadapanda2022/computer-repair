{% comment %} {% if contacts %}
    <div class="list-group mt-1" style="max-height: 200px; overflow-y: auto;">
        {% for contact in contacts %}
            <button type="button" class="list-group-item list-group-item-action contact-suggestion" 
                    data-id="{{ contact.id }}" 
                    data-type="{{ contact.contact_type }}"
                    data-name="{{ contact.name }}"
                    data-phone="{{ contact.phone|default:'' }}"
                    onmousedown="event.preventDefault();">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>{{ contact.name }}</strong>
                        {% if contact.company_name %}
                            <small class="text-muted d-block">{{ contact.company_name }}</small>
                        {% endif %}
                    </div>
                    <span class="badge bg-secondary">{{ contact.get_contact_type_display }}</span>
                </div>
                <div class="small text-muted">
                    <i class="bi bi-phone"></i> {{ contact.phone|default:"No phone" }}
                    {% if contact.email %} | <i class="bi bi-envelope"></i> {{ contact.email }}{% endif %}
                </div>
            </button>
        {% endfor %}
    </div>
{% else %}
    <div class="text-muted small mt-1">No contacts found. 
        <button type="button" class="btn btn-link btn-sm p-0" 
                hx-get="{% url 'accounting:contact_create' %}" 
                hx-target="#mainModalContent" 
                hx-trigger="click">
            <i class="bi bi-plus-circle"></i> Add New Contact
        </button>
    </div>
{% endif %} {% endcomment %}
