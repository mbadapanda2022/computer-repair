{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h3><i class="bi bi-people"></i> Contacts</h3>
    <div class="d-flex gap-2">
        <button class="btn btn-primary" 
            hx-get="{% url 'accounting:contact_create' %}" 
            hx-target="#mainModalContent" 
            hx-trigger="click">
            <i class="bi bi-plus-circle"></i> New Contact
        </button>
        <button class="btn btn-success" 
            hx-get="{% url 'accounting:repair_create' %}"  
            hx-target="#mainModalContent" 
            hx-trigger="click">
            <i class="bi bi-tools"></i> New Repair
        </button>
        <!-- Excel Export Button (Green + Icon) -->
        <a href="{% url 'accounting:export_contacts_excel' %}" class="btn btn-success" target="_blank">
            <i class="bi bi-file-earmark-excel"></i> Export Excel
        </a>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-body">
        <!-- Search & Filter Row -->
        <div class="row g-2 mb-3">
            <div class="col-md-5">
                <input type="text" name="search" class="form-control" placeholder="Search by name, phone, email..." 
                       hx-get="{% url 'accounting:contact_list' %}" 
                       hx-trigger="keyup changed delay:500ms" 
                       hx-target="#contacts-table-container" 
                       hx-include="[name='search'],[name='contact_type']" 
                       value="{{ search }}">
            </div>
            <div class="col-md-3">
                <select name="contact_type" class="form-select"
                        hx-get="{% url 'accounting:contact_list' %}"
                        hx-trigger="change"
                        hx-target="#contacts-table-container"
                        hx-include="[name='search'],[name='contact_type']">
                    <option value="">All Types</option>
                    <option value="customer" {% if contact_type_filter == 'customer' %}selected{% endif %}>Customer</option>
                    <option value="vendor" {% if contact_type_filter == 'vendor' %}selected{% endif %}>Vendor</option>
                    <option value="both" {% if contact_type_filter == 'both' %}selected{% endif %}>Both</option>
                </select>
            </div>
            <div class="col-md-2">
                <button class="btn btn-outline-secondary w-100" 
                        hx-get="{% url 'accounting:contact_list' %}"
                        hx-target="#contacts-table-container"
                        hx-include="[name='search'],[name='contact_type']">
                    <i class="bi bi-arrow-clockwise"></i> Reset
                </button>
            </div>
        </div>

        <!-- Contacts Table (HTMX container) -->
        <div id="contacts-table-container">
            {% include "contacts/partials/contact_table.html" %}
        </div>
    </div>
</div>
{% endblock %}
