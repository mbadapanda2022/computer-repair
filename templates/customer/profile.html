{% extends "base_customer.html" %}
{% load static %}
{% block title %}My Profile — Customer Portal{% endblock %}
{% block content %}
<div class="container-fluid px-4 py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-semibold mb-0">
                <i class="bi bi-person-circle text-primary me-2"></i>My Profile
            </h3>
        </div>
        <div>
            <button class="btn btn-primary"
                    hx-get="{% url 'customer:customer_profile_update' %}"
                    hx-target="#profile-container"
                    hx-swap="innerHTML">
                <i class="bi bi-pencil"></i> Edit Profile
            </button>
        </div>
    </div>
    <div id="profile-container">
        {% include "customer/partials/profile_content.html" %}
    </div>
</div>
{% endblock %}
