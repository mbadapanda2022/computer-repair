{% extends "base_customer.html" %}
{% load static %}

{% block content %}
<div class="container-fluid px-4 py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-semibold mb-0">
                <i class="bi bi-bell text-primary me-2"></i>My Notifications
            </h3>
            <p class="text-muted small mt-1">Stay updated with all your notifications</p>
        </div>
        <div class="d-flex gap-2 flex-wrap">
            {% if unread_count > 0 %}
            <button class="btn btn-outline-primary btn-sm" 
                    hx-post="{% url 'customer:customer_notification_mark_all_read' %}" 
                    hx-target="#notification-list-container"
                    hx-swap="outerHTML"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
                <i class="bi bi-check-all"></i> Mark all as read
            </button>
            {% endif %}
            <button class="btn btn-outline-danger btn-sm" 
                    hx-delete="{% url 'customer:customer_notification_delete_all' %}" 
                    hx-target="#notification-list-container"
                    hx-swap="outerHTML"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-confirm="Delete all notifications?">
                <i class="bi bi-trash"></i> Clear all
            </button>
        </div>
    </div>

    <!-- Notifications Container -->
    <div id="notification-list-container">
        {% include "customer/partials/_notification_items.html" %}
    </div>
</div>
{% endblock %}
