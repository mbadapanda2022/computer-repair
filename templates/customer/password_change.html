{% extends "base_customer.html" %}
{% load static %}

{% block title %}Change Password – Customer Portal{% endblock %}

{% block extra_head %}
<style>
    .password-card {
        border-radius: 16px;
        border: none;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .password-card .card-header {
        background: linear-gradient(135deg, #ffc107, #e0a800);
        color: #212529;
        border-radius: 16px 16px 0 0;
        padding: 1.5rem;
    }
    .btn-warning {
        background: linear-gradient(135deg, #ffc107, #e0a800);
        border: none;
        transition: all 0.3s;
    }
    .btn-warning:hover {
        transform: scale(1.02);
        box-shadow: 0 4px 12px rgba(255,193,7,0.4);
    }
</style>
{% endblock %}

{% block content %}
<!-- Container with ID for HTMX target consistency -->
<div id="profile-container">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card password-card shadow">
                    <div class="card-header">
                        <h4 class="mb-0 fw-semibold">
                            <i class="bi bi-shield-lock me-2"></i>Change Password
                        </h4>
                        <p class="mb-0 small opacity-75">Update your account password</p>
                    </div>
                    <div class="card-body p-4">
                        {% include 'customer/partials/_password_change_form.html' %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
