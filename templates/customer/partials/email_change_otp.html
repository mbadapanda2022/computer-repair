{% load static %}

<form method="post" 
      id="emailOtpForm"
      hx-post="{% url 'customer:email_change_verify' %}" 
      hx-target="#profile-container"
      hx-swap="innerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' 
      hx-indicator="#otp-spinner"
      novalidate>
    
    {% csrf_token %}
    
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <h5 class="fw-semibold mb-3">
                <i class="bi bi-shield-lock me-2 text-warning"></i>Verify New Email
            </h5>
            <p class="text-muted small">
                We've sent a 6-digit OTP to <strong>{{ email }}</strong>. 
                Please enter it below to confirm your new email.
            </p>
            
            <div class="mb-3">
                <label for="otp-input" class="form-label fw-semibold">OTP</label>
                <div class="input-group">
                    <input type="text" 
                           name="otp" 
                           id="otp-input" 
                           class="form-control" 
                           placeholder="Enter 6-digit OTP" 
                           maxlength="6" 
                           pattern="[0-9]{6}"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           oninput="this.value = this.value.replace(/[^0-9]/g, '');"
                           required>
                    <button type="button" id="resend-otp-btn" 
                            class="btn btn-outline-primary" 
                            disabled>
                        <span id="resend-timer">60</span>s
                    </button>
                </div>
                <div id="otp-errors" class="invalid-feedback d-block mt-1">
                    {% if form.otp.errors %}
                        {% for error in form.otp.errors %}
                            <div>{{ error }}</div>
                        {% endfor %}
                    {% endif %}
                </div>
                <small class="text-muted">OTP expires in 5 minutes.</small>
            </div>
        </div>
        <div class="card-footer bg-white d-flex gap-2">
            <button type="submit" class="btn btn-warning" id="otp-submit-btn">
                <span id="otp-spinner" class="spinner-border spinner-border-sm d-none me-1" role="status"></span>
                <i class="bi bi-check-circle me-1"></i> Verify & Update
            </button>
            <button type="button" class="btn btn-secondary" 
                    hx-get="{% url 'customer:email_change_request' %}" 
                    hx-target="#profile-container"
                    hx-swap="innerHTML">
                <i class="bi bi-arrow-left me-1"></i> Back
            </button>
        </div>
    </div>
</form>

<script>
(function() {
    // ============================================================
    // ⚠️ IMPORTANT: HTMX-loaded content ke liye DOMContentLoaded
    // kaam nahi karta. Isliye turant execute karo (IIFE).
    // ============================================================
    
    const timerDisplay = document.getElementById('resend-timer');
    const resendBtn = document.getElementById('resend-otp-btn');
    let timerInterval = null;

    function startTimer() {
        let timer = 60;
        if (timerDisplay) timerDisplay.textContent = timer;
        if (resendBtn) {
            resendBtn.disabled = true;
            resendBtn.innerHTML = `<span id="resend-timer">${timer}</span>s`;
        }
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(function() {
            timer -= 1;
            const el = document.getElementById('resend-timer');
            if (el) el.textContent = timer;
            if (resendBtn) {
                resendBtn.innerHTML = `<span id="resend-timer">${timer}</span>s`;
            }
            if (timer <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                if (resendBtn) {
                    resendBtn.disabled = false;
                    resendBtn.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i> Resend';
                }
            }
        }, 1000);
    }

    function resendOTP() {
        if (resendBtn && resendBtn.disabled) return;
        resendBtn.disabled = true;
        resendBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1" role="status"></span> Sending...';

        fetch("{% url 'customer:email_change_request' %}", {
            method: 'POST',
            headers: {
                'X-CSRFToken': '{{ csrf_token }}',
                'Content-Type': 'application/json',
            },
            credentials: 'same-origin',
            body: JSON.stringify({ resend: true })
        })
        .then(response => {
            if (response.redirected) {
                window.location.href = response.url;
                return null;
            }
            return response.json().catch(() => ({}));
        })
        .then(data => {
            if (data === null) return;  // redirecting
            startTimer();
            if (window.showToast) {
                window.showToast('success', 'New OTP sent to your email.', 'OTP Resent');
            }
        })
        .catch(() => {
            if (window.showToast) {
                window.showToast('danger', 'Failed to resend OTP. Please try again.', 'Error');
            }
            if (resendBtn) {
                resendBtn.disabled = false;
                resendBtn.innerHTML = '<i class="bi bi-arrow-clockwise me-1"></i> Retry';
            }
        });
    }

    // ---- Attach click handler ----
    if (resendBtn) {
        resendBtn.addEventListener('click', resendOTP);
    }

    // ---- Start timer immediately ----
    startTimer();

    // ===== SPINNER =====
    document.addEventListener('htmx:beforeRequest', function(evt) {
        if (evt.detail.target && evt.detail.target.closest('#profile-container')) {
            const spinner = document.getElementById('otp-spinner');
            const btn = document.getElementById('otp-submit-btn');
            if (spinner) spinner.classList.remove('d-none');
            if (btn) btn.disabled = true;
        }
    });
    document.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.target && evt.detail.target.closest('#profile-container')) {
            const spinner = document.getElementById('otp-spinner');
            const btn = document.getElementById('otp-submit-btn');
            if (spinner) spinner.classList.add('d-none');
            if (btn) btn.disabled = false;
        }
    });
})();
</script>
