{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h3>Bank Accounts</h3>
    <button class="btn btn-primary" 
        hx-get="{% url 'accounting:bank_account_add' %}" 
        hx-target="#mainModalContent" 
        hx-trigger="click">
        <i class="bi bi-plus-circle"></i> New Account
    </button>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-0">
        <div id="bank-account-table">
            {% include "bank/partials/bank_account_table.html" %}
        </div>
    </div>
</div>
{% endblock %}
