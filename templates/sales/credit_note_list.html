{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid px-4 py-3">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-semibold mb-0">
                <i class="bi bi-arrow-return-left text-warning me-2"></i>Credit Notes
            </h3>
            <p class="text-muted small mt-1 mb-0">Sales returns and adjustments</p>
        </div>
        <div class="d-flex gap-2">
            <a href="{% url 'accounting:invoice_list' %}" class="btn btn-outline-secondary">
                <i class="bi bi-receipt me-1"></i>All Invoices
            </a>
        </div>
    </div>

    <!-- Summary -->
    <div class="row g-3 mb-4">
        <div class="col-md-4 col-sm-6">
            <div class="card border-0 shadow-sm h-100 border-start border-4 border-warning">
                <div class="card-body d-flex align-items-center">
                    <div class="rounded-circle bg-warning bg-opacity-10 p-3 me-3">
                        <i class="bi bi-currency-rupee fs-4 text-warning"></i>
                    </div>
                    <div>
                        <small class="text-muted d-block text-uppercase fw-semibold">Total Credited</small>
                        <h5 class="mb-0 fw-bold text-warning">₹{{ total_amount|floatformat:2 }}</h5>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
            <form id="cn-filter-form" class="row g-3">
                <div class="col-md-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control"
                               placeholder="Search CN # or invoice #..."
                               name="search" value="{{ search }}"
                               hx-get="{% url 'accounting:credit_note_list' %}"
                               hx-trigger="keyup changed delay:300ms"
                               hx-target="#credit-note-table-container"
                               hx-include="#cn-filter-form"
                               hx-push-url="true">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select" name="customer"
                            hx-get="{% url 'accounting:credit_note_list' %}"
                            hx-trigger="change"
                            hx-target="#credit-note-table-container"
                            hx-include="#cn-filter-form"
                            hx-push-url="true">
                        <option value="">All Customers</option>
                        {% for c in customers %}
                            <option value="{{ c.id }}" {% if customer_id == c.id|stringformat:"s" %}selected{% endif %}>
                                {{ c.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <select class="form-select" name="reason"
                            hx-get="{% url 'accounting:credit_note_list' %}"
                            hx-trigger="change"
                            hx-target="#credit-note-table-container"
                            hx-include="#cn-filter-form"
                            hx-push-url="true">
                        <option value="">All Reasons</option>
                        {% for value, label in reason_choices %}
                            <option value="{{ value }}" {% if reason == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="date" class="form-control" name="date_from" value="{{ date_from }}"
                           hx-get="{% url 'accounting:credit_note_list' %}"
                           hx-trigger="change"
                           hx-target="#credit-note-table-container"
                           hx-include="#cn-filter-form"
                           hx-push-url="true">
                </div>
                <div class="col-md-2">
                    <a href="{% url 'accounting:credit_note_list' %}"
                       class="btn btn-secondary w-100"
                       hx-get="{% url 'accounting:credit_note_list' %}"
                       hx-target="#credit-note-table-container"
                       hx-push-url="true">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div id="credit-note-table-container">
        {% include "sales/partials/credit_note_table.html" %}
    </div>
</div>

<script>
// ============================================================
// Filter-preserving reload — triggered by reloadCreditNotes event
// (fired from credit_note_delete view's HX-Trigger header)
// ============================================================
function getCNFilterParams() {
    const form = document.getElementById('cn-filter-form');
    if (!form) return '';
    const fd = new FormData(form);
    const params = new URLSearchParams();
    for (const [k, v] of fd.entries()) {
        if (v && String(v).trim() !== '') params.append(k, v);
    }
    return params.toString();
}

document.body.addEventListener('reloadCreditNotes', function() {
    const qs = getCNFilterParams();
    const url = "{% url 'accounting:credit_note_list' %}" + (qs ? '?' + qs : '');
    htmx.ajax('GET', url, {
        target: '#credit-note-table-container',
        swap: 'innerHTML'
    });
});
</script>
{% endblock %}
