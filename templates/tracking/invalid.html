<!-- templates/tracking/invalid.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Invalid Tracking Link</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; font-family: 'Segoe UI', system-ui, sans-serif;">
    <div class="container d-flex align-items-center justify-content-center" style="min-height: 100vh;">
        <div class="card border-0 shadow-lg p-5 text-center" style="max-width: 480px; border-radius: 20px;">
            <i class="bi bi-exclamation-circle display-1 text-warning mb-3"></i>
            <h3 class="fw-bold mb-3">Invalid or Expired Link</h3>
            <p class="text-muted mb-4">
                This tracking link is either invalid or has expired (90 days).
                Please contact the service center for a new link.
            </p>
            <div class="alert alert-info mb-0" style="border-radius: 12px;">
                <i class="bi bi-info-circle"></i>
                Your repair is safe — only the tracking link needs refreshing.
            </div>
        </div>
    </div>
</body>
</html>
