{% load static %}
<form method="post" enctype="multipart/form-data"
      hx-post="{% if post %}{% url 'blog:post_edit' post.pk %}{% else %}{% url 'blog:post_create' %}{% endif %}"
      hx-target="#blog-posts-container"
      hx-swap="innerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    {% csrf_token %}
    {{ form.media }}

    <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-file-earmark-text me-2"></i>{{ action }} Blog Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>

    <div class="modal-body">
        {% for field in form %}
        <div class="mb-3">
            <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
            {{ field }}
            {% if field.help_text %}
                <small class="form-text text-muted">{{ field.help_text }}</small>
            {% endif %}
            {% if field.errors %}
                <div class="invalid-feedback d-block">
                    {% for error in field.errors %}{{ error }}{% endfor %}
                </div>
            {% endif %}
        </div>
        {% endfor %}
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i> {{ action }} Post
        </button>
    </div>
</form>
