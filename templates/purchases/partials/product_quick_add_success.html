<!-- templates/purchases/partials/product_quick_add_success.html-->
<div class="modal-header bg-success text-white">
    <h5 class="modal-title fw-bold">
        <i class="bi bi-check-circle-fill me-2"></i>Product Added!
    </h5>
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
</div>
<div class="modal-body text-center py-4">
    <i class="bi bi-box-seam display-1 text-success mb-3" style="font-size:4rem;"></i>
    <h4 class="fw-bold">{{ product.name }}</h4>
    <p class="text-muted">
        <span class="badge bg-secondary">{{ product.get_unit_display }}</span>
        <span class="badge bg-success">₹{{ product.purchase_price|floatformat:2 }}</span>
    </p>
    <div class="alert alert-success mb-0">
        <i class="bi bi-check-circle me-1"></i>
        Product created and added to purchase items!
    </div>
</div>
