{% if products %}
    <div class="list-group mt-1 shadow-sm" style="max-height: 200px; overflow-y: auto;">
        {% for product in products %}
            <button type="button"
                    class="list-group-item list-group-item-action product-suggestion py-1"
                    data-id="{{ product.id }}"
                    data-name="{{ product.name }}"
                    data-price="{{ product.purchase_price }}"
                    data-tax="{{ product.tax_rate }}"
                    onmousedown="event.preventDefault();">
                <div class="d-flex justify-content-between align-items-center">
                    <strong>{{ product.name }}</strong>
                    <small class="text-muted">₹{{ product.purchase_price|floatformat:2 }}</small>
                </div>
                <small class="text-muted d-flex align-items-center gap-2 flex-wrap">
                    <span>HSN: {{ product.hsn_code|default:"N/A" }}</span>
                    <span>·</span>
                    {% if product.current_stock|floatformat:0 == "0" %}
                        <span class="badge bg-danger">Out of Stock</span>
                    {% elif product.current_stock <= product.low_stock_threshold %}
                        <span class="badge bg-warning text-dark">
                            Low Stock ({{ product.current_stock|floatformat:0 }})
                        </span>
                    {% else %}
                        <span class="badge bg-success-subtle text-success">
                            Stock: {{ product.current_stock|floatformat:0 }}
                        </span>
                    {% endif %}
                </small>
            </button>
        {% endfor %}
    </div>
{% else %}
    <div class="text-muted small mt-1 p-2">
        <i class="bi bi-info-circle"></i> No products found.
        <button type="button" class="btn btn-link btn-sm p-0"
                hx-get="{% url 'accounting:purchase_product_quick_add' %}"
                hx-target="#quickAddModalContent"
                hx-trigger="click">
            <i class="bi bi-plus-circle"></i> Add New Product
        </button>
    </div>
{% endif %}
