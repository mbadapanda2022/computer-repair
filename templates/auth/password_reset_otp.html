{% extends 'base_public.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4 p-md-5 text-center">
                    <i class="bi bi-key fs-1 text-warning"></i>
                    <h4 class="fw-bold mt-2">Reset Password</h4>
                    <p class="text-muted">Enter your registered email to receive OTP</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="email" name="email" id="email" 
                                   class="form-control form-control-lg" 
                                   placeholder="you@example.com" 
                                   required>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold text-dark">Send OTP</button>
                    </form>
                    
                    <div class="mt-3">
                        <small><a href="{% url 'accounting:login' %}" class="text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Login</a></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
