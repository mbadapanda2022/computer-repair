{% extends 'base_public.html' %}
{% load static %}

{% block title %}Reset Password – A1 Computer Solutions{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Reset Password</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">Enter your registered email to receive an OTP for password reset.</p>
                    <form method="post" action="{% url 'accounting:password_reset_otp' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="your@email.com" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Send OTP</button>
                    </form>
                    <hr>
                    <p class="text-center small"><a href="{% url 'accounting:login' %}">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
