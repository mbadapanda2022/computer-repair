{% extends 'base_public.html' %}

{% block title %}Reset Link Sent – A1 Computer Solutions{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-envelope-check fs-1 text-success"></i>
                    <h4 class="mt-3">Check Your Email</h4>
                    <p class="text-muted">We've sent a password reset link to your email address.</p>
                    <a href="{% url 'accounting:login' %}" class="btn btn-outline-primary mt-2">Return to Login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
