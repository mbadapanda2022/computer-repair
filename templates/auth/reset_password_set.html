{% extends 'base_public.html' %}
{% load static %}

{% block title %}Set New Password – A1 Computer Solutions{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4 class="mb-0">Set New Password</h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" action="{% url 'accounting:reset_password_set' %}">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="password1" class="form-label">New Password</label>
                            <input type="password" name="password1" id="password1" class="form-control" placeholder="Min 8 characters" required>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label">Confirm Password</label>
                            <input type="password" name="password2" id="password2" class="form-control" placeholder="Re-enter password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Reset Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
