{% extends 'base_public.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="bi bi-check-circle fs-1 text-success"></i>
                        <h4 class="fw-bold mt-2">Set New Password</h4>
                        <p class="text-muted">for <strong>{{ email }}</strong></p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="password1" class="form-label fw-semibold">New Password</label>
                            <input type="password" name="password1" id="password1" 
                                   class="form-control form-control-lg" 
                                   placeholder="Min 8 characters" 
                                   required>
                        </div>
                        <div class="mb-3">
                            <label for="password2" class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" name="password2" id="password2" 
                                   class="form-control form-control-lg" 
                                   placeholder="Re-enter password" 
                                   required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Reset Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
