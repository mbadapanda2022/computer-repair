{% extends 'base_public.html' %}
{% load static %}

{% block title %}Login – A1 Computer Solutions{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h3 class="text-center mb-4 fw-bold">Login</h3>
                    <p class="text-center text-muted small mb-4">Join us to track your repairs and invoices</p>

                    <!-- Register Form (HTMX) -->
                    {% include 'auth/partials/_login_form.html' %}

                    <hr class="my-3">
                    <p class="text-center mb-0 small">
                        Don't have an account? 
                        <a href="{% url 'accounting:register' %}" class="text-decoration-none fw-semibold">Register</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
