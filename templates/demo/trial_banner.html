{# templates/demo/trial_banner.html — DEMO_MODE warning bar (injected before </body>) #}
<div id="demo-trial-banner"
     style="position:fixed; bottom:0; left:0; right:0; z-index:2050;
            background:linear-gradient(90deg,#fff3cd,#ffe69c); color:#6b5900;
            border-top:2px solid #e0a800; padding:8px 14px;
            font-size:14px; display:flex; align-items:center; gap:10px;
            flex-wrap:wrap; box-shadow:0 -4px 14px rgba(0,0,0,.12);">
  <span style="font-weight:700;">&#9203; Demo trial:</span>
  <span><strong>{{ trial.days_left }} days left</strong> of the 6-month
    evaluation. Full version + your own company setup available anytime.</span>
  <span style="margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
    <a href="https://wa.me/{{ contact.whatsapp }}?text=Hello%2C%20I%20am%20trying%20your%20Computer%20Repair%20software%20demo%20and%20want%20the%20full%20version."
       target="_blank" rel="noopener"
       style="background:#25d366; color:#fff; padding:6px 14px; border-radius:20px;
              font-weight:600; text-decoration:none; white-space:nowrap;">
      &#128241; WhatsApp {{ contact.phone }}
    </a>
    <a href="tel:+91{{ contact.phone }}"
       style="background:#0d6efd; color:#fff; padding:6px 14px; border-radius:20px;
              font-weight:600; text-decoration:none; white-space:nowrap;">
      &#128222; Call {{ contact.name }}
    </a>
    <a href="/demo-guide/" style="color:#6b5900; text-decoration:underline;">Guide</a>
  </span>
</div>
