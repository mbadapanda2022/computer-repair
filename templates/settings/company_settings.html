<!-- templates/settings/company_settings.html -->
{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3><i class="bi bi-gear"></i> Company Settings</h3>
            </div>

            <!-- Settings Form -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <div id="settings-form">
                        {% include "settings/company_settings_form.html" %}
                    </div>
                </div>
            </div>

            <!-- Database Management -->
            <div class="card shadow-sm mt-4">
                <div class="card-header bg-light">
                    <h5 class="mb-0"><i class="bi bi-database"></i> Database Management</h5>
                </div>
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <a href="{% url 'accounting:backup_database' %}" class="btn btn-secondary w-100">
                                <i class="bi bi-download"></i> Backup Database
                            </a>
                            <small class="text-muted d-block mt-1">Download current database backup</small>
                        </div>
                        <div class="col-md-4">
                            <button class="btn btn-warning w-100" 
                                    hx-get="{% url 'accounting:restore_database' %}" 
                                    hx-target="#mainModalContent"
                                    hx-trigger="click">
                                <i class="bi bi-upload"></i> Restore Database
                            </button>
                            <small class="text-muted d-block mt-1">Upload a database file to restore</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
