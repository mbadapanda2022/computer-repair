<tr id="message-row-{{ message.id }}" 
    class="{% if message.status == 'new' %}table-warning{% endif %}">
    <td>{{ forloop.counter }}</td>
    <td>{{ message.name }}</td>
    <td>{{ message.email }}</td>
    <td>{{ message.subject|truncatechars:30 }}</td>
    <td>
        <span class="badge 
            {% if message.status == 'new' %}bg-warning text-dark
            {% elif message.status == 'read' %}bg-info text-dark
            {% elif message.status == 'replied' %}bg-success
            {% elif message.status == 'spam' %}bg-danger
            {% endif %}">
            {{ message.get_status_display }}
        </span>
    </td>
    <td>{{ message.created_at|date:"d M Y H:i" }}</td>
    <td>
        <div class="btn-group btn-group-sm">
            <!-- View -->
            <button class="btn btn-outline-primary" 
                    hx-get="{% url 'accounting:message_detail' message.id %}"
                    hx-target="#messageDetailContent"
                    hx-trigger="click">
                <i class="bi bi-eye"></i>
            </button>
            <!-- Status dropdown -->
            <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                Status
            </button>
            <ul class="dropdown-menu">
                <li>
                    <button class="dropdown-item" 
                            hx-post="{% url 'accounting:message_mark_status' message.id %}"
                            hx-vals='{"status": "read"}'
                            hx-target="#message-row-{{ message.id }}"
                            hx-swap="outerHTML"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'><i class="bi bi-check2-circle"></i> Read</button>
                </li>
                <li>
                    <button class="dropdown-item" 
                            hx-post="{% url 'accounting:message_mark_status' message.id %}"
                            hx-vals='{"status": "replied"}'
                            hx-target="#message-row-{{ message.id }}"
                            hx-swap="outerHTML"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'><i class="bi bi-reply"></i> Replied</button>
                </li>
                <li>
                    <button class="dropdown-item text-danger" 
                            hx-post="{% url 'accounting:message_mark_status' message.id %}"
                            hx-vals='{"status": "spam"}'
                            hx-target="#message-row-{{ message.id }}"
                            hx-swap="outerHTML"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'><i class="bi bi-exclamation-triangle"></i> Spam</button>
                </li>
            </ul>
            <!-- Delete -->
            <button class="btn btn-outline-danger" 
                    hx-post="{% url 'accounting:message_delete' message.id %}"
                    hx-target="#message-row-{{ message.id }}"
                    hx-swap="outerHTML"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' 
                    hx-confirm="Delete this message?">
                <i class="bi bi-trash"></i>
            </button>
        </div>
    </td>
</tr>
