<div class="table-responsive">
    <table class="table table-hover">
        <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Status</th>
                <th>Received</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="message-rows">
            {% for msg in contact_messages %}
                {% include 'messages/_row.html' with message=msg %}
            {% empty %}
                <tr>
                    <td colspan="7" class="text-center text-muted">No messages found.</td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
