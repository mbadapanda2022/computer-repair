<div id="faq-list" class="accordion" id="faqAccordion">
    {% for faq in faqs %}
    <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button {% if not forloop.first %}collapsed{% endif %}" 
                    type="button" 
                    data-bs-toggle="collapse" 
                    data-bs-target="#faq{{ faq.id }}">
                {{ faq.question }}
            </button>
        </h2>
        <div id="faq{{ faq.id }}" 
             class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" 
             data-bs-parent="#faqAccordion">
            <div class="accordion-body">
                {{ faq.answer|linebreaks }}
                
                {% if include_controls %}
                <div class="mt-3 d-flex justify-content-start gap-2">
                    <button class="btn btn-sm btn-outline-primary" 
                            hx-get="{% url 'accounting:faq_edit' faq.pk %}"
                            hx-target="#mainModalContent"
                            hx-trigger="click">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" 
                            hx-delete="{% url 'accounting:faq_delete' faq.pk %}"
                            hx-target="#faq-list"
                            hx-swap="outerHTML"
                            hx-confirm="Are you sure you want to delete this FAQ?">
                        <i class="bi bi-trash"></i>
                    </button>
                    <span class="badge {% if faq.is_active %}bg-success{% else %}bg-secondary{% endif %} ms-1 align-self-center">
                        {{ faq.is_active|yesno:"Active,Inactive" }}
                    </span>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
    {% empty %}
    <div class="alert alert-info text-center">
        <i class="bi bi-info-circle"></i> No FAQs added yet. Please add some.
    </div>
    {% endfor %}
</div>
