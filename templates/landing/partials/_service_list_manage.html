{% load static %}
<div id="service-list" class="row g-4">
    {% for service in services %}
    <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0 landing-card">
            <div class="card-body text-center">
                <div class="service-icon display-1 text-primary mb-3">
                    {% if service.image %}
                        <img src="{{ service.image.url }}" alt="{{ service.title }}" style="height:80px; width:auto;">
                    {% elif service.icon %}
                        <i class="bi {{ service.icon }}"></i>
                    {% else %}
                        <i class="bi bi-box"></i>
                    {% endif %}
                </div>
                <h5 class="card-title">{{ service.title }}</h5>
                <p class="card-text text-muted small">{{ service.description|truncatechars:80 }}</p>
                
                <!-- Controls (Always visible on this page) -->
                <div class="mt-3 d-flex justify-content-center gap-2">
                    <button class="btn btn-sm btn-outline-primary" 
                            hx-get="{% url 'accounting:service_edit' service.pk %}"
                            hx-target="#mainModalContent"
                            hx-trigger="click">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" 
                            hx-delete="{% url 'accounting:service_delete' service.pk %}"
                            hx-target="#service-list"
                            hx-swap="outerHTML"
                            hx-confirm="Are you sure you want to delete this service?">
                        <i class="bi bi-trash"></i>
                    </button>
                    <span class="badge {% if service.is_active %}bg-success{% else %}bg-secondary{% endif %} ms-1 align-self-center">
                        {{ service.is_active|yesno:"Active,Inactive" }}
                    </span>
                </div>
            </div>
        </div>
    </div>
    {% empty %}
    <div class="col-12 text-center text-muted py-4">
        <i class="bi bi-plus-circle fs-1 d-block"></i>
        <p>No services added yet. Add one now!</p>
    </div>
    {% endfor %}
</div>
