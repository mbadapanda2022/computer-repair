{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h3 class="mb-0"><i class="bi bi-chat-quote"></i> Manage Testimonials</h3>
        <div class="d-flex gap-2">
            <button class="btn btn-primary" 
                    hx-get="{% url 'accounting:testimonial_create' %}" 
                    hx-target="#mainModalContent"
                    hx-trigger="click">
                <i class="bi bi-plus-circle"></i> Add Testimonial
            </button>
        </div>
    </div>
    
    <div id="testimonial-list-container">
        {% include "landing/partials/_testimonial_list.html" with testimonials=testimonials include_controls=True %}
    </div>
</div>
{% endblock %}
