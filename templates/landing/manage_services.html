{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><i class="bi bi-tools"></i> Manage Services</h3>
        <button class="btn btn-primary" 
                hx-get="{% url 'accounting:service_create' %}" 
                hx-target="#mainModalContent"
                hx-trigger="click">
            <i class="bi bi-plus-circle"></i> Add Service
        </button>
    </div>
    
    <div id="service-list-container">
        {% include "landing/partials/_service_list_manage.html" with services=services %}
    </div>
</div>
{% endblock %}
