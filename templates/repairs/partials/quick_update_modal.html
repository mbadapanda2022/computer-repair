{% load static %}

<form method="post"
      hx-post="{% url 'accounting:quick_update_repair' job.pk %}"
      hx-target="#mainModalContent"
      hx-swap="innerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      id="quickUpdateForm">

    {% csrf_token %}

    <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
            <i class="bi bi-pencil-square me-2"></i>Quick Update — {{ job.job_number }}
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">

        <div class="alert alert-info small">
            <i class="bi bi-info-circle me-1"></i>
            Only <strong>provided fields</strong> will be updated. Leave blank to keep existing values.
        </div>

        <!-- Financial Section -->
        <h6 class="text-primary border-bottom pb-2 mb-3">
            <i class="bi bi-currency-rupee"></i> Financials
        </h6>
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="id_estimated_cost" class="form-label fw-semibold">
                    Estimated Cost (₹)
                </label>
                <input type="number" step="0.01" name="estimated_cost"
                       id="id_estimated_cost" class="form-control"
                       value="{{ job.estimated_cost|default_if_none:'' }}"
                       placeholder="e.g., 1500">
                <small class="text-muted">Customer को यह भेजा जाएगा</small>
            </div>
            <div class="col-md-6">
                <label for="id_labour_charge" class="form-label fw-semibold">
                    Labour Charge (₹)
                </label>
                <input type="number" step="0.01" name="labour_charge"
                       id="id_labour_charge" class="form-control"
                       value="{{ job.labour_charge|default:'0' }}"
                       placeholder="0">
                <small class="text-muted">Final amount = Parts + Labour</small>
            </div>
        </div>

        <!-- Diagnosis Section -->
        <h6 class="text-primary border-bottom pb-2 mb-3 mt-4">
            <i class="bi bi-clipboard-check"></i> Diagnosis & Action
        </h6>
        <div class="row g-3 mb-3">
            <div class="col-12">
                <label for="id_diagnosis_report" class="form-label fw-semibold">
                    Diagnosis Report
                </label>
                <textarea name="diagnosis_report" id="id_diagnosis_report" rows="3"
                          class="form-control"
                          placeholder="क्या खराबी मिली...">{{ job.diagnosis_report|default:'' }}</textarea>
            </div>
            <div class="col-12">
                <label for="id_action_taken" class="form-label fw-semibold">
                    Action Taken
                </label>
                <textarea name="action_taken" id="id_action_taken" rows="3"
                          class="form-control"
                          placeholder="क्या repair किया...">{{ job.action_taken|default:'' }}</textarea>
            </div>
        </div>

        <!-- Reception & Ready -->
        <h6 class="text-primary border-bottom pb-2 mb-3 mt-4">
            <i class="bi bi-box-arrow-in-down"></i> Reception & Ready
        </h6>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="id_received_by" class="form-label fw-semibold">
                    Received By (staff name)
                </label>
                <input type="text" name="received_by" id="id_received_by"
                       class="form-control"
                       value="{{ job.received_by|default:'' }}"
                       placeholder="Staff name">
            </div>
            <div class="col-md-6">
                <label for="id_ready_at" class="form-label fw-semibold">
                    Ready Date
                </label>
                <input type="date" name="ready_at" id="id_ready_at"
                       class="form-control"
                       value="{{ job.ready_at|date:'Y-m-d'|default:'' }}">
                <small class="text-muted">When repair is complete</small>
            </div>
            <div class="col-12">
                <label for="id_received_remarks" class="form-label fw-semibold">
                    Reception Remarks
                </label>
                <textarea name="received_remarks" id="id_received_remarks"
                          rows="2" class="form-control"
                          placeholder="Device condition at reception...">{{ job.received_remarks|default:'' }}</textarea>
            </div>
        </div>

    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i>Save Changes
        </button>
    </div>
</form>
