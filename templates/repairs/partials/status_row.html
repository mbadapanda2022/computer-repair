<form hx-post="{% url 'accounting:update_repair_status' job.pk %}"
      hx-target="#mainModalContent"
      hx-swap="innerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      id="status-form">
    {% csrf_token %}

    <div class="row g-2 align-items-center">
        <div class="col-md-9">
            <select name="status" class="form-select form-select-sm" required>
                {% for value, label in status_choices %}
                    <option value="{{ value }}" {% if job.status == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-3">
            <button type="submit" class="btn btn-primary btn-sm w-100">
                <i class="bi bi-arrow-right-circle me-1"></i>Update
            </button>
        </div>
    </div>

    <small class="text-muted d-block mt-2">
        <i class="bi bi-info-circle me-1"></i>
        You will be asked to fill related details for the new status.
    </small>
</form>
