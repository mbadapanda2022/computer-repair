<form method="post"
      hx-post="{% url 'accounting:add_repair_part' job.pk %}"
      hx-target="#mainModalContent"
      hx-swap="innerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      id="partForm">
    {% csrf_token %}

    <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">
            <i class="bi bi-plus-circle me-2"></i>Add Part — {{ job.job_number }}
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {% for error in form.non_field_errors %}<div>{{ error }}</div>{% endfor %}
            </div>
        {% endif %}

        <div class="mb-3">
            <label for="id_product" class="form-label fw-semibold">
                Product <span class="text-danger">*</span>
            </label>
            <select name="product" id="id_product" class="form-select" required>
                <option value="">--------- Select Product ---------</option>
                {% for product in form.fields.product.queryset %}
                    <option value="{{ product.id }}"
                            data-price="{{ product.selling_price }}"
                            {% if form.product.value|stringformat:"s" == product.id|stringformat:"s" %}selected{% endif %}>
                        {{ product.name }}
                        {% if not product.is_service %}
                            (Stock: {{ product.current_stock|floatformat:0 }})
                        {% else %}
                            (Service)
                        {% endif %}
                        — ₹{{ product.selling_price|floatformat:2 }}
                    </option>
                {% endfor %}
            </select>
            <div id="field-product" class="invalid-feedback d-block">
                {{ form.product.errors|join:", " }}
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <label for="id_quantity" class="form-label fw-semibold">
                    Quantity <span class="text-danger">*</span>
                </label>
                <input type="number" name="quantity" id="id_quantity"
                       step="1" min="1"
                       class="form-control {% if form.quantity.errors %}is-invalid{% endif %}"
                       value="{{ form.quantity.value|default:'1' }}" required>
                <div id="field-quantity" class="invalid-feedback d-block">
                    {{ form.quantity.errors|join:", " }}
                </div>
            </div>
            <div class="col-md-6">
                <label for="id_unit_price" class="form-label fw-semibold">
                    Unit Price (₹) <span class="text-danger">*</span>
                </label>
                <input type="number" name="unit_price" id="id_unit_price"
                       step="0.01"
                       class="form-control {% if form.unit_price.errors %}is-invalid{% endif %}"
                       value="{{ form.unit_price.value|default:'' }}" required>
                <div id="field-unit_price" class="invalid-feedback d-block">
                    {{ form.unit_price.errors|join:", " }}
                </div>
            </div>
        </div>
    </div>

    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-check-circle me-1"></i>Add Part
        </button>
    </div>
</form>

<script>
    (function() {
        'use strict';

        // Guard: attach once only
        if (window.__partFormInit) return;
        window.__partFormInit = true;

        function initPartForm() {
            const sel = document.getElementById('id_product');
            if (!sel || sel.__bound) return;
            sel.__bound = true;

            sel.addEventListener('change', function() {
                const opt = this.options[this.selectedIndex];
                if (opt && opt.value) {
                    const price = opt.dataset.price;
                    const priceField = document.getElementById('id_unit_price');
                    if (priceField && (!priceField.value || priceField.value === '0')) {
                        priceField.value = price;
                    }
                }
            });
        }

        // Init for current DOM
        initPartForm();

        // Re-init after HTMX swap (guard prevents duplicate listeners)
        document.body.addEventListener('htmx:afterSwap', function(e) {
            if (e.detail.target && e.detail.target.closest('#mainModalContent')) {
                initPartForm();
            }
        });
    })();
</script>
