<!-- templates/notifications/email_notification.html-->
<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"></head>
<body>
    <p>Dear {{ user.get_full_name|default:user.username }},</p>
    <p><strong>{{ title }}</strong></p>
    <p>{{ message }}</p>
    {% if link %}
        <p><a href="{{ link }}">View Details</a></p>
    {% endif %}
    <p>Regards,<br>A1 Computer Solutions</p>
</body>
</html>
