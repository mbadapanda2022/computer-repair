<form method="post" 
      hx-post="{% url 'accounting:add_category_inline' %}" 
      hx-target="#mainModalContent"
      hx-swap="innerHTML">
    {% csrf_token %}
    <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-tags me-2"></i>Add New Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
        <div class="mb-3">
            <label for="id_name" class="form-label fw-semibold">Category Name</label>
            <input type="text" name="name" id="id_name" class="form-control" required>
            <div id="field-name" class="invalid-feedback d-block">
                {{ form.name.errors|join:", " }}
            </div>
        </div>
        <div class="mb-3">
            <label for="id_description" class="form-label fw-semibold">Description</label>
            <textarea name="description" id="id_description" class="form-control" rows="2"></textarea>
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Category</button>
    </div>
</form>
