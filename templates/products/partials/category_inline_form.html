<!-- templates/products/partials/category_inline_form.html -->
{% load static %}

<form method="post"
      action="{% url 'accounting:add_category_inline' %}"
      id="categoryInlineForm"
      hx-post="{% url 'accounting:add_category_inline' %}"
      hx-target="#category-field-container"
      hx-swap="innerHTML"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      novalidate>
    {% csrf_token %}

    <div class="d-flex align-items-center gap-2">
        <div class="flex-grow-1">
            <div class="input-group">
                <span class="input-group-text bg-primary text-white">
                    <i class="bi bi-tag"></i>
                </span>
                <input type="text"
                       name="name"
                       id="id_category_name"
                       class="form-control {% if form.name.errors %}is-invalid{% endif %}"
                       placeholder="New category name..."
                       value="{{ form.name.value|default:'' }}"
                       hx-get="{% url 'accounting:validate_category_field' %}"
                       hx-trigger="blur, keyup changed delay:300ms"
                       hx-target="#category-name-error"
                       hx-swap="innerHTML"
                       hx-include="#id_category_name"
                       autofocus
                       required>
                <button type="submit" class="btn btn-success" id="category-submit-btn">
                    <i class="bi bi-check-circle"></i>
                </button>
                <button type="button" class="btn btn-secondary"
                        id="category-cancel-btn"
                        hx-get="{% url 'accounting:add_category_inline' %}?cancel=1"
                        hx-include="#current-category-id"
                        hx-target="#category-field-container"
                        hx-swap="innerHTML">
                    <i class="bi bi-x-circle"></i>
                </button>
            </div>
            <div id="category-name-error" class="invalid-feedback d-block">
                {% for error in form.name.errors %}<div>{{ error }}</div>{% endfor %}
            </div>
        </div>
    </div>
</form>

<script>
(function() {
    'use strict';

    // Live invalid class toggle
    document.body.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target && evt.detail.target.id === 'category-name-error') {
            const input = document.getElementById('id_category_name');
            if (!input) return;
            const errText = (evt.detail.target.innerText || '').trim();
            if (errText) {
                input.classList.add('is-invalid');
            } else {
                input.classList.remove('is-invalid');
            }
        }
    });
})();
</script>
