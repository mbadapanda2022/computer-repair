{% extends "base.html" %}
{% load static %}

{% block title %}Bad Request | {{ block.super }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <div class="error-page">
                <h1 class="display-1 text-muted">400</h1>
                <h2 class="mb-4">Bad Request</h2>
                <p class="lead text-muted">The request could not be processed. Please check and try again.</p>
                <div class="mt-4">
                    <a href="{% url 'home' %}" class="btn btn-primary btn-lg">
                        <i class="bi bi-house"></i> Go Home
                    </a>
                    <button onclick="history.back()" class="btn btn-outline-secondary btn-lg ms-2">
                        <i class="bi bi-arrow-left"></i> Go Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
