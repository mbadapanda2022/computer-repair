# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "assertive"          # गहरा और सख्त रिव्यू के लिए (chill से assertive कर दिया)
  request_changes_workflow: true # गंभीर मुद्दों पर changes request करे
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "develop"

  # ─────────────────────────────────────────────
  # Django Python फ़ाइलों के लिए निर्देश
  # ─────────────────────────────────────────────
  path_instructions:
    - path: "**/*.py"
      instructions: |
        You are reviewing a Django (Python) project. Follow these rules strictly:

        **Models:**
        - Every model should have a clear `__str__` method.
        - Ensure `Meta` class defines `ordering`, `verbose_name`, and `indexes` where needed.
        - Check that `ForeignKey` fields have `on_delete` explicitly set and `related_name` defined.
        - Recommend `model.full_clean()` before `save()` where validation is critical.
        - Flag missing database indexes on fields used in `filter()`, `order_by()`, or `get()`.
        - Ensure `unique=True`, `db_index=True`, and constraints are used appropriately.

        **Views:**
        - Prefer Class-Based Views (CBV) only when it makes sense; otherwise keep FBVs clean.
        - Detect N+1 query problems and recommend `select_related()` / `prefetch_related()`.
        - Recommend `only()` / `defer()` for large querysets.
        - Ensure `login_required`, `permission_required`, or `LoginRequiredMixin` is used on protected views.
        - Flag any raw SQL unless absolutely necessary (then recommend parameterized queries).

        **Forms:**
        - Ensure server-side validation exists for every form field.
        - Recommend `ModelForm` over `Form` when tied to a model.
        - Check `clean()` and `clean_<field>()` methods for edge cases.

        **Security (CRITICAL):**
        - Flag `DEBUG = True` in production settings.
        - Flag hardcoded `SECRET_KEY`, DB passwords, or API keys. Recommend `.env` + `python-decouple` or `django-environ`.
        - Ensure `ALLOWED_HOSTS` is not `['*']` in production.
        - Check for CSRF protection on all POST views.
        - Verify `@csrf_exempt` is not misused.
        - Flag `mark_safe()`, `|safe` filter, or `format_html()` misuse (XSS risk).
        - Ensure `SECURE_SSL_REDIRECT`, `SESSION_COOKIE_SECURE`, `CSRF_COOKIE_SECURE` are set in production.

        **HTMX Views:**
        - Ensure views returning partials are clearly named (e.g., `_partial.html`).
        - Verify `request.headers.get('HX-Request')` is checked when the same URL serves both full page and partial.
        - Recommend `HttpResponse` for fragments and `render()` with correct partial template.
        - Ensure HTMX responses set proper status codes (200, 204, 422, etc.).
        - Flag missing CSRF token handling in HTMX POST requests (`hx-headers` or `{% csrf_token %}`).

        **Performance:**
        - Recommend caching (`cache_page`, `@cached_property`, low-level cache API) for expensive operations.
        - Flag missing `paginate_by` on list views.
        - Recommend `bulk_create()` / `bulk_update()` for loops with `save()`.
        - Detect repeated DB hits inside loops.

        **Code Quality:**
        - Every function/method should have a clear docstring (purpose, args, returns).
        - Do NOT suggest adding type annotations.
        - Do NOT add comments about imports.
        - Avoid generic `except Exception` in tests.

    # ─────────────────────────────────────────────
    # HTMX और Templates के लिए निर्देश
    # ─────────────────────────────────────────────
    - path: "**/templates/**/*.html"
      instructions: |
        You are reviewing Django templates for a Django + HTMX + Bootstrap project.

        **HTMX:**
        - Use `hx-get`, `hx-post`, `hx-put`, `hx-delete` correctly with proper `hx-target` and `hx-swap`.
        - Prefer `hx-target="closest ..."` or specific IDs instead of `body`.
        - Ensure CSRF token is included for `hx-post`: use `hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'` or a global `htmx:configRequest` listener.
        - Recommend `hx-indicator` and loading spinners for better UX.
        - Use `hx-trigger` with `delay`, `changed`, or `throttle` for search inputs (avoid firing on every keystroke).
        - Prefer HTMX partials over full page reloads where appropriate.
        - Use `hx-boost` carefully; do not break forms.
        - Suggest `hx-push-url` for navigation that should update the browser URL.
        - Warn about using HTMX for file uploads without `hx-encoding="multipart/form-data"`.

        **Bootstrap:**
        - Use semantic Bootstrap 5 classes (e.g., `d-flex`, `gap-3`, `text-muted`) instead of custom inline styles.
        - Recommend responsive grid (`col-12 col-md-6 col-lg-4`) for mobile-first design.
        - Ensure forms use `form-control`, `form-select`, `form-check`, and proper `<label>` for accessibility.
        - Recommend `aria-*` attributes and `role` for accessibility.
        - Prefer Bootstrap modals with proper `data-bs-*` attributes; if using HTMX + modal, recommend `hx-target` into modal body.
        - Flag deprecated Bootstrap 4 classes in a Bootstrap 5 project.
        - Suggest `container`, `row`, `col` structure properly.

        **Django Templates:**
        - Ensure `{% csrf_token %}` is present in every POST form.
        - Recommend `{% url %}` tag instead of hardcoded URLs.
        - Flag `|safe` filter unless the content is truly safe (XSS risk).
        - Recommend `{% static %}` for all static assets.
        - Avoid logic in templates; move to views or template tags.
        - Use `{% include %}` for reusable partials (e.g., `_card.html`, `_form_field.html`).

    # ─────────────────────────────────────────────
    # JavaScript / HTMX config
    # ─────────────────────────────────────────────
    - path: "**/static/**/*.js"
      instructions: |
        - Prefer vanilla JS + HTMX over jQuery.
        - Ensure `htmx:configRequest` sets CSRF token globally if not using per-request headers.
        - Flag inline event handlers (onclick="") — recommend addEventListener.
        - Ensure HTMX event listeners (`htmx:afterSwap`, `htmx:beforeRequest`) are cleaned up properly.

    # ─────────────────────────────────────────────
    # Tests
    # ─────────────────────────────────────────────
    - path: "**/tests/**/*.py"
      instructions: |
        - Test files contain only procedural/generic data — no sensitive info.
        - Use `pytest-django` or Django's `TestCase` consistently.
        - Recommend `factory_boy` or `Faker` for test data.
        - Avoid generic `except Exception` — tests should fail loudly.
        - Ensure each test has a clear name describing the behavior.
        - Recommend `assertNumQueries` for performance-sensitive views.

    # ─────────────────────────────────────────────
    # Settings और Requirements
    # ─────────────────────────────────────────────
    - path: "**/settings*.py"
      instructions: |
        - Split settings into base/dev/prod if the project is large.
        - Ensure `DEBUG`, `SECRET_KEY`, `ALLOWED_HOSTS`, `DATABASES` come from environment variables.
        - Flag any hardcoded secrets.
        - Recommend `django-environ` or `python-decouple`.

    - path: "**/requirements*.txt"
      instructions: |
        - Flag unpinned dependencies (no version specified).
        - Recommend `pip-tools` or `poetry` for reproducible builds.
        - Warn about outdated Django versions with known CVEs.

chat:
  auto_reply: true